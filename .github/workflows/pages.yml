name: Deploy Site

on:
  push:
    branches: [ "master" ]
    paths:
      - 'MitRecap.Web/**'
      - 'MitRecap.Core/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish Site
        run: dotnet publish MitRecap.Web/MitRecap.Web.csproj --configuration Release --output site

      # The site is served from /MitRecap/, not from the root of the domain.
      - name: Set Base Path
        run: sed -i 's#<base href="/" />#<base href="/${{ github.event.repository.name }}/" />#' site/wwwroot/index.html

      - name: Upload Site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
